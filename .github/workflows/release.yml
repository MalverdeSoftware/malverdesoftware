# Release workflow for the shared packages (docs/specs/SPEC-distribution.md).
# Every run builds, tests, checks and packs the packages and keeps the tarballs as an artifact.
# A tag `<package>-v<version>` (for example `ui-v0.1.1`) also publishes that one package to npm
# with provenance. The publish step uses npm trusted publishing (OIDC). npm can't use OIDC for a
# package's very first release, so for that release only it falls back to the NPM_TOKEN secret;
# delete the secret once trusted publishing is configured for each package.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ['*-v*']
  pull_request:
    paths:
      - 'packages/*/package.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/check-release.mjs'
      - '.github/workflows/release.yml'
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check LICENSE, NOTICE and tarball contents
        run: node scripts/check-release.mjs
      - name: Tag matches a package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          version="${tag##*-v}"
          actual=$(node -p "require('./packages/${name}/package.json').version")
          if [ "$actual" != "$version" ]; then
            echo "Tag $tag says $version, but packages/$name is $actual." >&2
            exit 1
          fi
      - run: mkdir -p artifacts && npm pack --workspaces --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.tgz
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm 11.5.1 or newer (needed for trusted publishing)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Publish the tagged package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="${GITHUB_REF_NAME%-v*}"
          pkg=$(node -p "require('./packages/${name}/package.json').name")
          version=$(node -p "require('./packages/${name}/package.json').version")
          if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
            echo "${pkg}@${version} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish -w "packages/${name}" --provenance --access public
