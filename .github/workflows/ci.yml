name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Packages carry LICENSE and NOTICE
        run: node scripts/check-release.mjs
      - name: Envelope fixtures reproduce
        run: node packages/sealed-envelope/scripts/make-fixtures.mjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python cross-check of the envelope wire format
        working-directory: packages/sealed-envelope
        run: |
          python -m pip install --quiet cryptography==50.0.2
          python scripts/crosscheck.py

  # A fresh mPile checkout installs, type-checks, runs and builds with the packed packages.
  consumer:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MalverdeSoftware/mpile
          ref: main
          path: mpile
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run pack
      - run: node scripts/check-consumer.mjs
        env:
          MPILE_REPO: ${{ github.workspace }}/mpile
